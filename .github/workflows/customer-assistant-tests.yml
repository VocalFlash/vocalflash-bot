name: Customer Assistant Bot Tests

on:
  pull_request:
    branches:
      - main
      - multivocale-runtime-v2
  push:
    branches:
      - assistant-conversation-photo-v1

permissions:
  contents: read

jobs:
  customer-assistant-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run customer assistant tests
        run: python -m unittest -v test_customer_text_bridge.py
